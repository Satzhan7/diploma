# Rendered by the nginx image's envsubst step (/etc/nginx/templates).
# CSP_CONNECT_SRC and CSP_IMG_SRC default to the production values in the Dockerfile.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; img-src ${CSP_IMG_SRC}; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src ${CSP_CONNECT_SRC}" always;

  location / {
    try_files $uri /index.html;
  }

  location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
    expires 30d;
    add_header Cache-Control "public, immutable";
  }
}
