name: CI

# Every pull request (PRs to v1 included; stacked PRs need it too) and
# pushes to the release branches.
on:
  pull_request:
  push:
    branches: [v1, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint:check
      - run: npm test -- --ci
      - run: npm run build

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- --watchAll=false
      - name: npm run build
        run: npm run build
        env:
          # CRA turns lint warnings into build errors when CI=true; the lint
          # step above already reports them. Goes away with Vite (step 1.2).
          CI: false
